<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Rounded squircle background -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="#1A594A"/>
  <rect x="34" y="34" width="444" height="444" rx="96" fill="none" stroke="#E8B339" stroke-opacity="0.38" stroke-width="4"/>

  <!-- Rub el Hizb 8-point Mushaf medallion (explicit fill + crisp stroke) -->
  <rect x="126" y="126" width="260" height="260" rx="20" fill="#236C5B"/>
  <polygon points="256,72 440,256 256,440 72,256" fill="#236C5B"/>
  <rect x="126" y="126" width="260" height="260" rx="20" fill="none" stroke="#FAF5E8" stroke-width="10" stroke-linejoin="round"/>
  <polygon points="256,72 440,256 256,440 72,256" fill="none" stroke="#FAF5E8" stroke-width="10" stroke-linejoin="round"/>

  <!-- Inner dark emerald breathing circle -->
  <circle cx="256" cy="256" r="118" fill="#123F34" stroke="#E8B339" stroke-opacity="0.30" stroke-width="3"/>

  <!-- 5 Audio waveform bars -->
  <rect x="163" y="224" width="22" height="64" rx="11" fill="#FFFDF8"/>
  <rect x="201" y="192" width="22" height="128" rx="11" fill="#FFFDF8"/>
  <rect x="239" y="172" width="22" height="168" rx="11" fill="#FFFDF8"/>
  <rect x="277" y="200" width="22" height="112" rx="11" fill="#FFFDF8" fill-opacity="0.62"/>
  <rect x="315" y="220" width="22" height="72" rx="11" fill="#FFFDF8" fill-opacity="0.45"/>

  <!-- Gold timing playhead / marker line + top diamond -->
  <rect x="268" y="142" width="7" height="228" rx="3.5" fill="#F2BE42"/>
  <polygon points="271.5,122 286,139 271.5,156 257,139" fill="#F2BE42"/>
</svg>
