[package]
name = "ayah-timer"
version = "0.1.0"
edition = "2021"
description = "Native Rust desktop app to time Quran surah recitations by ayah with ONNX AI forced alignment"

[dependencies]
anyhow = "1"
arboard = "3"
deep-filter-rt = "0.2"
dirs = "6"
iced = { version = "0.13.1", features = ["canvas", "tokio", "advanced", "svg", "image"] }
ndarray = "0.17"
ort = { version = "2.0.0-rc.10", features = ["download-binaries", "copy-dylibs"] }
reqwest = { version = "0.13", features = ["json", "stream", "gzip"] }
rfd = "0.16"
rodio = { version = "0.20.1", default-features = false, features = ["symphonia-all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5.4", features = ["all"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time"] }
