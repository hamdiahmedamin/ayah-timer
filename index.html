<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ayah Timer</title>
<meta name="description" content="أداة لتوقيت آيات تلاوة سورة كاملة وتصدير ملف JSON بصيغة mp3quran (ayat_timing).">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23286656'/%3E%3Cpath d='M6 20v-8M10 23V9M14 18v-4M18 25V7M22 21v-10M26 17v-2' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Amiri+Quran&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: "KFGQPC Warsh";
  src: url("https://cdn.jsdelivr.net/gh/thetruetruth/quran-data-kfgqpc@main/warsh/font/warsh.10.woff2") format("woff2");
  font-display: swap;
}
@font-face {
  font-family: "KFGQPC Qaloon";
  src: url("https://cdn.jsdelivr.net/gh/thetruetruth/quran-data-kfgqpc@main/qaloon/font/qaloon.10.woff2") format("woff2");
  font-display: swap;
}
:root {
  --bg: #f4f1e8; --panel: #fffdf8; --panel-2: #f8f5ec; --ink: #1a2220; --muted: #5d6b67;
  --line: #e2dccb; --accent: #1f6454; --accent-ink: #fff; --soft: #e2efe9;
  --wave: #9cb9af; --wave-played: #1f6454; --mark: #c84b14; --now: #c9920e;
  --verse: rgba(31,100,84,.10); --danger: #b42318; --danger-bg: rgba(180,35,24,.09);
  --shadow: 0 1px 2px rgba(20,30,26,.04), 0 8px 24px rgba(20,30,26,.04);
  --quran-font: "Amiri Quran", "IBM Plex Sans Arabic", serif;
  color-scheme: light;
}
ayah-timer[data-riwayah="warsh"] { --quran-font: "KFGQPC Warsh", "Amiri Quran", serif; }
ayah-timer[data-riwayah="qalun"] { --quran-font: "KFGQPC Qaloon", "Amiri Quran", serif; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1413; --panel: #161e1d; --panel-2: #1c2624; --ink: #e7ece9; --muted: #93a39e;
    --line: #273331; --accent: #6fd1b6; --accent-ink: #0b1412; --soft: #1b2c28;
    --wave: #38524d; --wave-played: #6fd1b6; --mark: #f08a5d; --now: #ecc45a;
    --verse: rgba(111,209,182,.11); --danger: #f97066; --danger-bg: rgba(249,112,102,.12);
    --shadow: 0 1px 2px rgba(0,0,0,.25), 0 10px 28px rgba(0,0,0,.22);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1413; --panel: #161e1d; --panel-2: #1c2624; --ink: #e7ece9; --muted: #93a39e;
  --line: #273331; --accent: #6fd1b6; --accent-ink: #0b1412; --soft: #1b2c28;
  --wave: #38524d; --wave-played: #6fd1b6; --mark: #f08a5d; --now: #ecc45a;
  --verse: rgba(111,209,182,.11); --danger: #f97066; --danger-bg: rgba(249,112,102,.12);
  --shadow: 0 1px 2px rgba(0,0,0,.25), 0 10px 28px rgba(0,0,0,.22);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: radial-gradient(1100px 420px at 85% -6%, var(--soft), transparent 65%), var(--bg);
  color: var(--ink);
  font: 14.5px/1.6 "IBM Plex Sans Arabic", system-ui, sans-serif;
}
main { max-width: 1360px; margin: 0 auto; padding: 16px 20px 44px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Header */
header.topbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 14px; flex-wrap: wrap; margin-bottom: 14px;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand svg { flex: none; width: 38px; height: 38px; border-radius: 11px; box-shadow: var(--shadow); }
.brand h1 { font-size: 20px; line-height: 1.2; margin: 0; letter-spacing: -.01em; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
.top-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

/* Panels & Heads */
.panel {
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
  padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px;
}
.panel-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; flex-wrap: wrap; margin-bottom: 12px;
}
.panel-head h2 { font-size: 14.5px; margin: 0; display: flex; align-items: center; gap: 8px; }
.panel-head-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

/* Controls */
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.grow { flex: 1 1 200px; min-width: 0; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
label.check {
  display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink);
  cursor: pointer; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--panel-2); min-height: 38px; user-select: none;
}
label.check input { min-height: auto; margin: 0; accent-color: var(--accent); }
input, select, textarea, button {
  font: inherit; color: inherit; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); padding: 7px 11px; min-height: 38px;
  transition: background-color 150ms ease, border-color 150ms ease, transform 80ms ease, opacity 150ms ease;
}
input:hover:not(:disabled), select:hover:not(:disabled), textarea:hover:not(:disabled) { border-color: var(--muted); }
input[type="number"] { width: 88px; direction: ltr; font-variant-numeric: tabular-nums; }
input[type="file"] { padding: 5px 8px; font-size: 13px; }
button {
  cursor: pointer; background: var(--soft); border-color: transparent; font-weight: 600;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
}
button:hover:not(:disabled) { filter: brightness(.97); }
button:active:not(:disabled) { transform: translateY(1px); }
button.primary { background: var(--accent); color: var(--accent-ink); }
button.ghost { background: transparent; border-color: var(--line); }
button.ghost:hover:not(:disabled) { background: var(--panel-2); }
button.danger-ghost { background: transparent; border-color: var(--line); color: var(--muted); }
button.danger-ghost:hover:not(:disabled) { color: var(--danger); border-color: var(--danger); background: var(--danger-bg); }
button.sm { min-height: 32px; padding: 4px 10px; font-size: 12.5px; border-radius: 8px; }
button:disabled { opacity: .45; cursor: default; }

/* Segmented Tabs */
.segmented {
  display: inline-flex; gap: 3px; padding: 3px; border-radius: 11px;
  background: var(--panel-2); border: 1px solid var(--line);
}
.segmented button {
  min-height: 30px; padding: 4px 12px; font-size: 13px; border-radius: 8px;
  background: transparent; color: var(--muted); font-weight: 600;
}
.segmented button[aria-selected="true"] {
  background: var(--accent); color: var(--accent-ink);
}
.pill {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--soft); color: var(--ink); border-radius: 999px;
  padding: 2px 9px; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums;
}
.segmented button[aria-selected="true"] .pill {
  background: rgba(255,255,255,.22); color: var(--accent-ink);
}

/* Source Grid */
.source-panel { position: relative; z-index: 20; }
.source-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
  gap: 10px; align-items: end;
}
.source-grid .span-2 { grid-column: span 2; }
@media (max-width: 640px) { .source-grid .span-2 { grid-column: span 1; } }
.dock-tuning smart-select { min-width: 84px; }
.source-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.badge {
  display: inline-flex; align-items: center; background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 999px; padding: 5px 12px; font-size: 12.5px; font-weight: 600; min-height: 38px;
}

/* Studio Workspace */
.workspace { display: grid; grid-template-columns: 1fr; gap: 14px; align-items: start; }
@media (min-width: 1024px) {
  .workspace { grid-template-columns: minmax(0, 1fr) 410px; }
  .inspector-col { position: sticky; top: 16px; }
}
.studio-col, .inspector-col { min-width: 0; }
.studio-col > *, .inspector-col > * { margin-bottom: 14px; }
.studio-col > :last-child, .inspector-col > :last-child { margin-bottom: 0; }

/* Seekbar */
.seek { display: flex; align-items: center; gap: 10px; margin-top: 10px; direction: ltr; }
.seek input[type="range"] {
  flex: 1; min-height: 24px; padding: 0; border: 0; background: transparent;
  accent-color: var(--accent); cursor: pointer;
}
.seek .clock { min-width: 64px; font-size: 12.5px; color: var(--muted); font-weight: 600; }

/* Transport & Tool Dock */
.dock { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
.dock-main {
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  padding: 10px; border-radius: 13px; background: var(--panel-2); border: 1px solid var(--line);
}
button.hero-mark {
  min-height: 48px; padding: 0 20px; font-size: 15.5px; border-radius: 11px;
  flex: 1 1 220px; justify-content: space-between;
}
button.hero-mark kbd {
  background: rgba(255,255,255,.18); color: inherit; border-color: rgba(255,255,255,.35);
  font-size: 11px; padding: 1px 6px;
}
.btn-group { display: inline-flex; gap: 4px; align-items: center; }
.clock-chip {
  font-variant-numeric: tabular-nums; direction: ltr; min-width: 128px; text-align: center;
  font-weight: 700; font-size: 13.5px; padding: 6px 10px; border-radius: 9px;
  background: var(--bg); border: 1px solid var(--line);
}
.dock-sub {
  display: flex; gap: 10px; align-items: flex-end; justify-content: space-between;
  flex-wrap: wrap; padding-top: 12px; border-top: 1px solid var(--line);
}
.dock-tools, .dock-tuning { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
.ai-bar {
  background: var(--panel-2); border: 1px solid var(--accent); border-radius: 12px;
  padding: 10px 12px; display: flex; flex-direction: column; gap: 6px;
}
.ai-bar[hidden] { display: none; }
.ai-bar.err { border-color: var(--danger); background: var(--danger-bg); }
.ai-bar.done { border-color: #16a34a; }
.ai-bar-top {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 600;
}
.ai-bar-top #aiPct { font-variant-numeric: tabular-nums; color: var(--accent); }
.ai-bar.err .ai-bar-top #aiPct { color: var(--danger); }
.ai-track {
  height: 7px; border-radius: 999px; background: var(--bg);
  border: 1px solid var(--line); overflow: hidden;
}
.ai-fill {
  height: 100%; width: 0%; background: var(--accent); border-radius: 999px;
  transition: width 180ms ease;
}
.ai-bar.done .ai-fill { background: #16a34a; }
.ai-fill.indet {
  width: 35% !important;
  animation: ai-slide 1.1s ease-in-out infinite;
}
@keyframes ai-slide {
  0% { transform: translateX(180%); }
  50% { transform: translateX(-20%); }
  100% { transform: translateX(-180%); }
}

/* Status, Keys, Hints, I/O */
.hint { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
.status { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.status:empty { display: none; }
.status.err {
  color: var(--danger); background: var(--danger-bg); border: 1px solid var(--danger);
  padding: 3px 10px; border-radius: 999px;
}
kbd {
  font: 11.5px ui-monospace, monospace; border: 1px solid var(--line);
  border-bottom-width: 2px; border-radius: 5px; padding: 1px 5px; background: var(--bg);
}
.keys {
  color: var(--muted); font-size: 12px; display: flex; gap: 8px 14px;
  flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line);
}
.keys span { display: inline-flex; align-items: center; gap: 5px; }
textarea {
  width: 100%; min-height: 220px; direction: ltr;
  font: 12px/1.5 ui-monospace, monospace; resize: vertical; margin-top: 10px;
}
.hidden { display: none !important; }
footer.foot { margin-top: 14px; text-align: center; color: var(--muted); font-size: 12px; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <ayah-timer></ayah-timer>
</main>

<script>
// Verse counts per surah: Hafs (Kufan count) and the Madani count used by
// Warsh and Qalun, from the Tanzil and King Fahd Complex (Quranpedia) texts.
const COUNTS = {
  hafs: [7,286,200,176,120,165,206,75,129,109,123,111,43,52,99,128,111,110,98,135,112,78,118,64,77,227,93,88,69,60,34,30,73,54,45,83,182,88,75,85,54,53,89,59,37,35,38,29,18,45,60,49,62,55,78,96,29,22,24,13,14,11,11,18,12,12,30,52,52,44,28,28,20,56,40,31,50,40,46,42,29,19,36,25,22,17,19,26,30,20,15,21,11,8,8,19,5,8,8,11,11,8,3,9,5,4,7,3,6,3,5,4,5,6],
  madani: [7,285,200,175,122,167,206,76,130,109,121,111,44,54,99,128,110,105,99,134,111,76,119,62,77,226,95,88,69,59,33,30,73,54,46,82,182,86,72,84,53,50,89,56,36,34,39,29,18,45,60,47,61,55,77,99,28,21,24,13,14,11,11,18,12,12,31,52,52,44,30,28,18,55,39,31,50,40,45,42,29,19,36,25,22,17,19,26,32,20,15,21,11,8,8,20,5,8,9,11,10,8,3,9,5,5,6,3,6,3,5,4,5,6],
};
const SURAHS = ["الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"];
const API = 'https://www.mp3quran.net/api/v3';

const fmt = (ms) => {
  if (ms == null || !isFinite(ms)) return '–';
  const s = Math.max(0, ms) / 1000, m = Math.floor(s / 60);
  return `${m}:${(s - m * 60).toFixed(2).padStart(5, '0')}`;
};
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, '');
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  n.append(...kids.flat().filter((k) => k != null));
  return n;
};

/* ------------------------------------------------------------------ */
/* <wave-view>: the waveform, the verse marks, the play head.          */
/* Click to seek; drag a mark to move a verse start; wheel/zoom to     */
/* look closer. Fires `seek` {ms} and `markmove` {ayah, ms}.           */
/* ------------------------------------------------------------------ */
class WaveView extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({ mode: 'open' }).innerHTML = `
      <style>
        :host { display: block; }
        .wrap { position: relative; overflow-x: auto; overflow-y: hidden; border-radius: 12px;
                background: var(--bg); border: 1px solid var(--line); direction: ltr; }
        .spacer { position: relative; height: 170px; }
        canvas { position: sticky; left: 0; top: 0; display: block; height: 170px; touch-action: none; cursor: pointer; }
        .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px;
               font-size: 12px; color: var(--muted); }
        .zoom-ctl { display: flex; align-items: center; gap: 6px; flex: 1 1 200px; min-width: 0; }
        .zoom-btn { font: inherit; font-weight: 700; border: 1px solid var(--line); background: var(--panel-2);
                    color: var(--ink); border-radius: 7px; width: 26px; height: 26px; cursor: pointer;
                    display: inline-flex; align-items: center; justify-content: center; padding: 0; }
        .zoom-btn:hover { border-color: var(--muted); }
        input[type="range"] { flex: 1; min-width: 80px; accent-color: var(--accent); cursor: pointer; }
        .z { font-variant-numeric: tabular-nums; direction: ltr; font-weight: 600; min-width: 34px;
             text-align: center; padding: 2px 7px; border-radius: 999px; background: var(--panel-2);
             border: 1px solid var(--line); color: var(--ink); }
        .follow-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
                       background: var(--panel-2); border: 1px solid var(--line); color: var(--ink); cursor: pointer; }
        .follow-pill input { accent-color: var(--accent); margin: 0; }
      </style>
      <div class="wrap"><div class="spacer"><canvas></canvas></div></div>
      <div class="bar">
        <div class="zoom-ctl">
          <span>تكبير</span>
          <button type="button" class="zoom-btn" data-z="-1" aria-label="تصغير">−</button>
          <input type="range" min="1" max="60" value="1" step="1" aria-label="مستوى التكبير">
          <button type="button" class="zoom-btn" data-z="1" aria-label="تكبير">+</button>
          <span class="z">×1</span>
        </div>
        <label class="follow-pill"><input type="checkbox" checked class="follow"> متابعة رأس التشغيل</label>
      </div>`;
    this.canvas = this.shadowRoot.querySelector('canvas');
    this.wrap = this.shadowRoot.querySelector('.wrap');
    this.spacer = this.shadowRoot.querySelector('.spacer');
    this.zoomInput = this.shadowRoot.querySelector('input[type=range]');
    this.followBox = this.shadowRoot.querySelector('.follow');
    this.peaks = null; this.duration = 0; this.starts = []; this.now = 0; this.current = -1;
    this.zoom = 1; this.drag = null;
    const setZoom = (val) => {
      const keep = this.now;
      this.zoom = Math.max(1, Math.min(60, val));
      this.zoomInput.value = this.zoom;
      this.shadowRoot.querySelector('.z').textContent = '×' + this.zoom;
      this.spacer.style.width = this.width() + 'px';
      this.reveal(keep, true);
      this.draw();
    };
    this.zoomInput.addEventListener('input', () => setZoom(+this.zoomInput.value));
    this.shadowRoot.querySelectorAll('.zoom-btn').forEach((b) =>
      b.addEventListener('click', () => setZoom(this.zoom + (+b.dataset.z * Math.max(1, Math.round(this.zoom / 6)))))
    );
    this.wrap.addEventListener('scroll', () => this.draw(), { passive: true });
    new ResizeObserver(() => this.draw()).observe(this.wrap);
    this.canvas.addEventListener('pointerdown', (e) => this.down(e));
    this.canvas.addEventListener('pointermove', (e) => this.move(e));
    this.canvas.addEventListener('pointerup', (e) => this.up(e));
    this.canvas.addEventListener('pointercancel', (e) => this.up(e));
  }
  set data({ peaks, duration }) {
    if (!peaks || !duration) {
      this.peaks = null; this.duration = 0; this.zoom = 1;
      this.zoomInput.value = 1;
      this.shadowRoot.querySelector('.z').textContent = '×1';
      this.wrap.scrollLeft = 0;
      this.draw();
      return;
    }
    this.peaks = peaks; this.duration = duration;
    // About 45 seconds a screen, so verse marks stay apart.
    this.zoom = Math.max(1, Math.min(60, Math.round(duration / 45000)));
    this.zoomInput.value = this.zoom;
    this.shadowRoot.querySelector('.z').textContent = '×' + this.zoom;
    this.spacer.style.width = this.width() + 'px';
    this.draw();
  }
  update({ starts, now, current }) {
    if (starts) this.starts = starts;
    if (now != null) this.now = now;
    if (current != null) this.current = current;
    if (this.followBox.checked && !this.drag) this.reveal(this.now);
    this.draw();
  }
  width() { return Math.max(this.wrap.clientWidth, 10) * this.zoom; }
  xOf(ms) { return this.duration ? (ms / this.duration) * this.width() : 0; }
  msOf(x) { return Math.max(0, Math.min(this.duration, (x / this.width()) * this.duration)); }
  reveal(ms, center) {

  hit(x) {
    let best = null, bestD = 7;

  down(e) {

  }
  move(e) {
    const x = this.localX(e);
    this.canvas.style.cursor = this.drag || this.hit(x) != null ? 'ew-resize' : 'pointer';

        const b = s.slice(cur + 1).find((v) => v != null) ?? this.duration;

    const n = this.peaks.length, played = this.xOf(this.now), mid = waveH / 2;
    for (let sx = 0; sx < viewW; sx++) {
      const wx = sx + off;
      if (wx >= totalW) break;
      const i = Math.min(n - 1, Math.floor((wx / totalW) * n));
      const v = this.peaks[i] * ((waveH - 12) * .45);

    const step = steps.find((st) => st * pps >= 70) || 600;

    const t1 = Math.ceil(this.msOf(off + viewW) / 1000);

    g.font = '600 11px sans-serif'; g.textAlign = 'left';
    s.forEach((ms, a) => {
      if (a < 1 || ms == null) return;

class AyahTable extends HTMLElement {
  constructor() {
    super();

      <style>
        :host { display: block; }

        td.t { direction: ltr; font-variant-numeric: tabular-nums; }
        input { width: 82px; direction: ltr; font: inherit; font-variant-numeric: tabular-nums; padding: 4px 6px;

        input:focus { outline: none; border-color: var(--accent); }
        button { font: inherit; font-size: 12px; border: 0; border-radius: 7px; padding: 4px 7px; margin: 0 1px;

        button:hover:not(:disabled) { filter: brightness(.95); }

        button:disabled { opacity: .35; cursor: default; }
      </style>
      <div class="scroll"><table><thead><tr>
        <th>الآية</th><th>البداية (ms)</th><th>النهاية</th><th>المدة</th><th>أدوات</th>
      </tr></thead><tbody></tbody></table></div>`;
    this.body = this.shadowRoot.querySelector('tbody');
    this.rows = [];
    this.body.addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      const ayah = +b.closest('tr').dataset.ayah;
      this.dispatchEvent(new CustomEvent(b.dataset.act, { detail: { ayah, by: +(b.dataset.by || 0) } }));
    });
    this.body.addEventListener('change', (e) => {
      if (e.target.tagName !== 'INPUT') return;
      e.target.dataset.committed = '1';

    if (this.rows.length !== count + 1) {
      this.body.replaceChildren(...Array.from({ length: count + 1 }, (_, a) => {
        const tr = el('tr', { 'data-ayah': a },
          el('td', {}, a === 0 ? 'الافتتاح' : String(a)),
          el('td', {}, a === 0 ? el('span', {}, '0') : el('input', { type: 'number', min: 0, step: 10 })),
          el('td', { class: 't' }), el('td', { class: 't' }),
          el('td', {},
            el('button', { 'data-act': 'play', title: 'تشغيل الآية' }, '▶'),
            a === 0 ? null : el('button', { 'data-act': 'set', title: 'البداية = موضع التشغيل' }, '⌖'),
            a === 0 ? null : el('button', { 'data-act': 'nudge', 'data-by': -100, title: '−100ms' }, '−'),
            a === 0 ? null : el('button', { 'data-act': 'nudge', 'data-by': 100, title: '+100ms' }, '+'),

      this.valBadge.textContent = cur.badge;
      this.valBadge.hidden = !cur.badge;

    this.menu.hidden = false;
    const showSearch = this.hasAttribute('searchable') || this._items.length > 8;
    this.searchWrap.hidden = !showSearch;
    this.searchInput.value = '';
    this._active = -1;
    this.renderList();
    if (showSearch) setTimeout(() => this.searchInput.focus(), 0);

      const sel = this.list.querySelector('.opt[aria-selected="true"]') || this.list.querySelector('.opt:not(:disabled)');

  }

      this.list.replaceChildren(el('div', { class: 'empty' }, 'لا توجد نتائج'));
      return;
    }
    this.list.replaceChildren(...rows.map((it, idx) => {
      const sel = it.value === this._val;

    if (!opts.length) return;

      e.preventDefault(); e.stopPropagation();

      const curIdx = opts.findIndex((o) => o.classList.contains('active'));
      const nextIdx = curIdx < 0 ? (dir > 0 ? 0 : opts.length - 1) : (curIdx + dir + opts.length) % opts.length;

      opts[nextIdx].scrollIntoView?.({ block: 'nearest' });

      if (act) this.pick(act.dataset.val);
    }

    this.input = this.shadowRoot.querySelector('input');
    this.zone = this.shadowRoot.querySelector('.zone');
    this.emptyBox = this.shadowRoot.querySelector('.empty');

    this.zone.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); this.input.click(); }
    });

    }

  }
  clear(emit = false) {
    this._file = null;
    this.input.value = '';
    this.emptyBox.hidden = false;
    this.pickedBox.hidden = true;
    if (emit) this.dispatchEvent(new Event('change', { bubbles: true }));
  }
}

class MushafView extends HTMLElement {
  constructor() {
    super();
    this._lastKey = '';
    this._lastCur = -1;
    this.attachShadow({ mode: 'open' }).innerHTML = `
      <style>
        :host { display: block; }

        .num { color: var(--accent); font-size: .92em; padding-inline: 2px; }
        .empty { text-align: center; padding: 36px 12px; color: var(--muted); font-size: 13.5px; }
      </style>
      <div class="wrap">
        <div class="head">
          <span class="sname">سورة الفاتحة</span>
          <div class="meta"><span class="pill">مصحف حفص</span><span class="pages"></span></div>
        </div>
        <div class="basmala" hidden>بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
        <div class="body"></div>
      </div>`;
    this.sname = this.shadowRoot.querySelector('.sname');
    this.riwEl = this.shadowRoot.querySelector('.pill');
    this.pagesEl = this.shadowRoot.querySelector('.pages');
    this.basmalaEl = this.shadowRoot.querySelector('.basmala');
    this.body = this.shadowRoot.querySelector('.body');
    this.body.addEventListener('click', (e) => {
      const v = e.target.closest('.v');
      if (!v) return;
      this.dispatchEvent(new CustomEvent('play', { detail: { ayah: +v.dataset.ayah } }));
    });
  }
  render({ surah, texts, pages, starts, current, riwayah }) {
    const arD = (n) => String(n).replace(/\d/g, (d) => '٠١٢٣٤٥٦٧٨٩'[d]);
    this.sname.textContent = `سورة ${SURAHS[surah - 1] || ''}`;
    this.riwEl.textContent = riwayah === 'warsh' ? 'مصحف ورش' : riwayah === 'qalun' ? 'مصحف قالون' : 'مصحف حفص';
    const validPages = (pages || []).filter(Boolean);
    if (validPages.length) {
      const p0 = validPages[0], p1 = validPages[validPages.length - 1];
      this.pagesEl.textContent = p0 === p1 ? `ص ${arD(p0)}` : `ص ${arD(p0)}–${arD(p1)}`;
    } else this.pagesEl.textContent = '';

    const showBasmala = surah !== 9 && !(surah === 1 && riwayah === 'hafs');
    this.basmalaEl.hidden = !showBasmala || !texts;

    const key = `${surah}:${riwayah}:${texts ? texts.length : 0}`;
    if (key !== this._lastKey) {
      this._lastKey = key;
      if (!texts || !texts.length) {
        this.body.replaceChildren(el('div', { class: 'empty' }, 'جارٍ تحميل نص المصحف…'));
        return;
      }
      const isMadaniFont = riwayah === 'warsh' || riwayah === 'qalun';
      this.body.replaceChildren(...texts.map((t, i) => {
        const a = i + 1;
        const num = isMadaniFont ? `\u00A0${arD(a)}` : ` ﴿${a}﴾`;
        return el('span', { class: 'v', 'data-ayah': a }, t, el('span', { class: 'num' }, num), ' ');
      }));
    }
    const spans = this.body.querySelectorAll('.v');
    spans.forEach((sp, i) => {
      const a = i + 1;
      sp.classList.toggle('marked', starts?.[a] != null);
      sp.classList.toggle('now', a === current);
    });
    if (current > 0 && current !== this._lastCur) {
      this._lastCur = current;
      const active = spans[current - 1];
      if (active && this.offsetParent !== null) active.scrollIntoView?.({ block: 'nearest' });
    }
  }
}
customElements.define('mushaf-view', MushafView);

  /* ---- sources ---- */
  clearAudio() {

  setSource(src) {

  setRiwayah(riw) {

  riwRegex(riw = this.state.riwayah) {

  }
  async loadReciters() {
    try {
      const [rec, reads] = await Promise.all([
        fetch(`${API}/reciters?language=ar`).then((r) => r.json()),
        fetch(`${API}/ayat_timing/reads`).then((r) => r.json()).catch(() => []),
      ]);
      this.allReciters = rec.reciters.sort((a, b) => a.name.localeCompare(b.name, 'ar'));
      const norm = (u) => u.replace(/^https?:\/\//, '').replace(/\/$/, '');
      this.timedReads = new Map(reads.map((r) => [norm(r.folder_url), r.id]));
      this.norm = norm;
      this.fillReciters();
    } catch (err) {
      this.$('reciter').setItems([{ value: '', label: 'تعذّر تحميل القرّاء', disabled: true }]);
      this.setSource('file');

  fillReciters() {
    if (!this.allReciters) return;
    const rx = this.riwRegex();
    this.reciters = rx
      ? this.allReciters.filter((r) => r.moshaf.some((m) => rx.test(m.name)))
      : this.allReciters;
    const sel = this.$('reciter');
    sel.setItems(this.reciters.map((r, i) => ({ value: String(i), label: r.name })));
    let pick = -1;
    if (this.state.riwayah === 'warsh') {
      pick = this.reciters.findIndex((r) => r.name.includes('الكوشي'));
      if (pick < 0) pick = this.reciters.findIndex((r) => r.moshaf.some((m) => /ورش/.test(m.name) && m.surah_total === 114));
    } else if (this.state.riwayah === 'qalun') {
      pick = this.reciters.findIndex((r) => r.name.includes('الحصري'));
    } else {
      pick = this.reciters.findIndex((r) => r.name.includes('العفاسي'));
    }
    sel.value = String(pick >= 0 ? pick : 0);
    this.fillMoshaf();
  }
  fillMoshaf() {
    const r = this.reciters?.[+this.$('reciter').value]; if (!r) return;
    this.$('moshaf').setItems(r.moshaf.map((m, i) => ({
      value: String(i),
      label: m.name,
      badge: this.timedReads.has(this.norm(m.server)) ? 'له توقيت' : '',
    })));
    const rx = this.riwRegex() || /حفص/;
    const idx = r.moshaf.findIndex((m) => rx.test(m.name));

  moshaf() {

  pickedMoshaf() {
    const m = this.moshaf(); if (!m) return;
    if (this.state.source === 'mp3quran') { this.clearAudio(); this.say(''); }
    const madani = /ورش|قالون/.test(m.name);
    this.$('counting').value = madani ? 'madani' : 'hafs';
    this.state.counting = this.$('counting').value;
    const has = (m.surah_list || '').split(',').map(Number).filter((x) => x >= 1 && x <= 114);
    this.$('surah').setEnabledValues(this.state.source === 'mp3quran' && has.length ? has : null);
    if (this.state.source === 'mp3quran' && has.length && !has.includes(this.state.surah)) return this.setSurah(has[0]);

  audioUrl() {
    const s = String(this.state.surah).padStart(3, '0');

    if (this.state.source === 'url') return this.$('url').value.trim() || null;

  async isMp3Blob(blob, label = '') {
    if (/mpeg|mp3/i.test(blob.type || '') || /\.mp3(\?|$)/i.test(label)) return true;
    const h = new Uint8Array(await blob.slice(0, 4).arrayBuffer());
    if (h[0] === 0x49 && h[1] === 0x44 && h[2] === 0x33) return true; // ID3
    return h[0] === 0xFF && (h[1] & 0xE0) === 0xE0;
  }
  async decodeChunkedMp3(blob, onChunk, signal) {
    const head = new Uint8Array(await blob.slice(0, 10).arrayBuffer());
    let pos = 0;
    if (head.length >= 10 && head[0] === 0x49 && head[1] === 0x44 && head[2] === 0x33) {
      pos = 10 + (((head[6] & 0x7f) << 21) | ((head[7] & 0x7f) << 14) | ((head[8] & 0x7f) << 7) | (head[9] & 0x7f));
    }
    const SLICE = 2 * 1024 * 1024;
    const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    let sampleOffset = 0;
    try {
      while (pos < blob.size) {
        if (signal?.aborted) throw new Error('aborted');
        let end = Math.min(blob.size, pos + SLICE);
        if (end < blob.size) {
          const w0 = Math.max(pos + 4096, end - 8192), w1 = Math.min(blob.size, end + 8192);
          const win = new Uint8Array(await blob.slice(w0, w1).arrayBuffer());
          const mid = end - w0;
          let found = -1;
          for (let d = 0; d < win.length - 4; d++) {
            for (const idx of [mid + d, mid - d]) {
              if (idx < 0 || idx + 3 >= win.length) continue;
              if (win[idx] === 0xFF && (win[idx + 1] & 0xE0) === 0xE0 && (win[idx + 1] & 0x06) !== 0
                && (win[idx + 2] & 0xF0) !== 0xF0 && (win[idx + 2] & 0x0C) !== 0x0C) {
                found = w0 + idx; break;
              }
            }
            if (found >= 0) break;
          }
          if (found > pos + 4096) end = found;
        }
        const ab = await blob.slice(pos, end).arrayBuffer();
        if (signal?.aborted) throw new Error('aborted');
        const buf = await ctx.decodeAudioData(ab);
        const pcm = buf.getChannelData(0);
        await onChunk(pcm, sampleOffset, end);
        sampleOffset += pcm.length;
        pos = end;
      }
    } finally {
      ctx.close().catch(() => {});
    }
    return sampleOffset;
  }
  async load() {
    const seq = ++this.loadSeq;
    this.cancelAi();
    this.stopAt = null;
    this.audio.pause();
    let blob, label, ctx = null;
    try {
      if (this.state.source === 'file') {
        const f = this.$('file').file || this.$('file').files?.[0]; if (!f) return this.say('اختر ملفًا صوتيًا.', true);
        blob = f; label = f.name;
      } else {
        const url = this.audioUrl(); if (!url) return this.say('لا يوجد رابط.', true);
        this.say('جارٍ تنزيل التلاوة…');
        const res = await fetch(url);
        if (seq !== this.loadSeq) return;
        if (!res.ok) throw new Error(res.status);
        blob = await res.blob();
        if (seq !== this.loadSeq) return;
        label = url;
      }
      if (this.audioBlobUrl) URL.revokeObjectURL(this.audioBlobUrl);
      this.audioBlob = blob;
      this.audioBlobUrl = URL.createObjectURL(blob);
      this.state.label = label;
      this.audio.src = this.audioBlobUrl;
      this.audio.playbackRate = +this.$('rate').value;
      this.say('جارٍ تحليل الصوت…');

      if (blob.size > 35 * 1024 * 1024 && await this.isMp3Blob(blob, label)) {
        const P = 6000, rawPeaks = new Float32Array(P), energyChunks = [];
        const totalSamplesEst = Math.max(1, Math.round((this.state.duration || (blob.size / 16000) * 1000) * 16));
        const win = 160; // 10 ms at 16 kHz
        let durMs = this.state.duration;
        const totalSamples = await this.decodeChunkedMp3(blob, (pcm, off, bytesDone) => {
          if (seq !== this.loadSeq) throw new Error('aborted');
          const est = Math.max(totalSamplesEst, off + pcm.length);
          const step = Math.max(1, Math.floor(est / P));
          for (let j = 0; j < pcm.length; j += 4) {
            const pIdx = Math.min(P - 1, Math.floor((off + j) / step));
            const v = Math.abs(pcm[j]);
            if (v > rawPeaks[pIdx]) rawPeaks[pIdx] = v;
          }
          const eLen = Math.floor(pcm.length / win), eArr = new Float32Array(eLen);
          for (let i = 0; i < eLen; i++) {
            let s = 0; for (let j = i * win; j < (i + 1) * win; j += 2) s += pcm[j] * pcm[j];
            eArr[i] = Math.sqrt(s / (win / 2));
          }
          energyChunks.push(eArr);
          this.say(`جارٍ تحليل الصوت… ${Math.round((bytesDone * 100) / blob.size)}%`);
        });
        if (seq !== this.loadSeq) return;
        const top = Math.max(...rawPeaks) || 1;
        this.peaks = rawPeaks.map((p) => p / top);
        const totalE = energyChunks.reduce((a, b) => a + b.length, 0);
        const E = new Float32Array(totalE);
        let eOff = 0; for (const c of energyChunks) { E.set(c, eOff); eOff += c.length; }
        this.energy = E;
        durMs = Math.round((totalSamples / 16000) * 1000);
        this.state.duration = durMs;
      } else {
        const ab = await blob.arrayBuffer();
        if (seq !== this.loadSeq) return;
        ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
        const buf = await ctx.decodeAudioData(ab);
        if (seq !== this.loadSeq) return;
        this.analyse(buf);
        this.state.duration = Math.round(buf.duration * 1000);
      }
      this.wave.data = { peaks: this.peaks, duration: this.state.duration };
      this.restore();
      this.say(`جاهز · ${fmt(this.state.duration)}`);
    } catch (err) {
      if (seq !== this.loadSeq || err.message === 'aborted') return;
      if (this.state.source === 'url' && err instanceof TypeError) {
        this.say('تعذّر تنزيل الرابط (قد يمنع الخادم الوصول CORS؛ جرّب تنزيل الملف وفتحه من جهازك).', true);
      } else {
        this.say('تعذّر تحميل التلاوة: ' + err.message, true);
      }
    } finally {
      ctx?.close().catch(() => {});
    }
  }
  // Peaks for the drawing, and loudness every 10 ms for finding pauses.
  analyse(buf) {
    const data = buf.getChannelData(0), rate = buf.sampleRate;
    const P = 6000, step = Math.max(1, Math.floor(data.length / P)), peaks = new Float32Array(P);
    for (let i = 0; i < P; i++) {
      let m = 0; const end = Math.min(data.length, (i + 1) * step);
      for (let j = i * step; j < end; j += 4) { const v = Math.abs(data[j]); if (v > m) m = v; }
      peaks[i] = m;
    }
    const top = Math.max(...peaks) || 1;
    this.peaks = peaks.map((p) => p / top);
    const win = Math.round(rate / 100), E = new Float32Array(Math.floor(data.length / win));
    for (let i = 0; i < E.length; i++) {
      let s = 0; for (let j = i * win; j < (i + 1) * win; j += 2) s += data[j] * data[j];
      E[i] = Math.sqrt(s / (win / 2));
    }
    this.energy = E;
  }

  /* ---- surah and saved work ---- */
  count() { return COUNTS[this.state.counting][this.state.surah - 1]; }
  // Work is saved per recording, surah and count.
  storeKey() {
    const src = this.state.source === 'file' ? this.state.label : this.audioUrl();
    return `ayah-timer:${src || ''}:${this.state.surah}:${this.state.counting}`;
  }
  setSurah(n) {
    if (this.state.source === 'mp3quran' && n !== this.state.surah) { this.clearAudio(); this.say(''); }
    this.state.surah = n; this.$('surah').value = String(n);
    this.state.texts = null; this.state.pages = null; this.loadText(); this.restore();
  }
  restore() {
    this.$('count').textContent = `${this.count()} آية`;
    try { this.state.starts = JSON.parse(localStorage.getItem(this.storeKey())) || [0]; }
    catch { this.state.starts = [0]; }
    this.state.starts.length = Math.min(this.state.starts.length, this.count() + 1);
    this.refresh();
  }
  changed() {

  textEdition() {
    if (this.state.counting === 'hafs') return 'hafs';
    return /قالون/.test(this.moshaf()?.name || '') || this.state.riwayah === 'qalun' ? 'qalun' : 'warsh';
  }
  async loadText() {
    const surah = this.state.surah, ed = this.textEdition();
    this.dataset.riwayah = ed;
    try {
      let texts = null, pages = null;
      if (ed === 'hafs') {
        const r = await fetch(`https://api.alquran.cloud/v1/surah/${surah}/quran-uthmani`).then((x) => x.json());
        const ayahs = r?.data?.ayahs;
        if (ayahs) {
          texts = ayahs.map((a) => a.text.replace(/^\uFEFF/, ''));
          pages = ayahs.map((a) => a.page || null);

      } else {

          const url = ed === 'qalun'
            ? 'https://cdn.jsdelivr.net/gh/thetruetruth/quran-data-kfgqpc@main/qaloon/data/QaloonData_v10.json'
            : 'https://cdn.jsdelivr.net/gh/thetruetruth/quran-data-kfgqpc@main/warsh/data/warshData_v10.json';
          this.mushafPromise[ed] ||= fetch(url)
            .then((x) => { if (!x.ok) throw new Error(x.status); return x.json(); })
            .then((rows) => {
              const grouped = Array.from({ length: 114 }, () => ({ texts: [], pages: [] }));
              for (const row of rows) {
                const s = grouped[row.sura_no - 1];
                if (!s) continue;

                s.pages.push(Number(row.page) || null);
              }

              return grouped;
            })
            .catch((err) => { delete this.mushafPromise[ed]; throw err; });
          await this.mushafPromise[ed];
        }

      const lo = i === 0 ? 0 : out[i - 1] + 50;
      const hi = i === out.length - 1 ? totalMs - 50 : out[i + 1] - 50;
      const at = Math.round(out[i] / 10);
      const a0 = Math.max(0, at - 25), a1 = Math.min(E.length - 1, at + 25);
      if (a1 <= a0) continue;
      let best = a0, low = E[a0];
      for (let k = a0 + 1; k <= a1; k++) if (E[k] < low) { low = E[k]; best = k; }
      if (low < quiet) {
        let j = best;
        const back = low * 3 + 0.005;
        while (j < E.length - 1 && j < best + 40 && E[j] < back) j++;
        const cand = Math.max(0, j * 10 - 40);
        if (cand >= lo && cand <= hi) out[i] = cand;
      }
    }
    return out;
  }
  async aiAlign() {
    if (!this.audioBlob) return this.say('حمّل التلاوة أولًا.', true);
    const n = this.count();
    if (!this.state.texts || this.state.texts.length !== n) {
      this.say('جارٍ تحميل نص السورة…');
      await this.loadText();
    }
    if (!this.state.texts || this.state.texts.length !== n) {
      return this.say('تعذّر تحميل نص السورة.', true);
    }
    let allMarked = true;
    for (let a = 1; a <= n; a++) if (this.state.starts[a] == null) { allMarked = false; break; }
    if (allMarked) {
      if (!window.confirm('كل الآيات معلَّمة بالفعل. إعادة التوقيت بالذكاء الاصطناعي من جديد؟')) return;
      this.state.starts = [0];
    }

    this.aiRunning = true;
    this.aiAbort = new AbortController();
    const signal = this.aiAbort.signal;
    this.$('aiAuto').textContent = '⏹ إيقاف AI';
    this.setAiProgress('جارٍ تحضير الصوت للذكاء الاصطناعي…', 0);
    await this.paintYield();

    try {
      await this.ensureAiModel(signal);

      const CHUNK_SAMPLES = 10 * 16000;
      const OV_SAMPLES = 1.5 * 16000;
      const OV_FRAMES = OV_SAMPLES / 320;
      let tail = new Float32Array(0);
      let bufParts = [], bufLen = 0, processedSamples = 0;
      const emChunks = [];

      const flushChunk = async (pcmCore) => {
        if (signal.aborted) throw new Error('aborted');
        const dur = this.state.duration || Math.round(((processedSamples + pcmCore.length) * 1000) / 16000);
        const startMs = Math.round((processedSamples * 1000) / 16000);
        const endMs = Math.min(dur, Math.round(((processedSamples + pcmCore.length) * 1000) / 16000));
        const startPct = dur ? Math.min(95, Math.round((startMs * 95) / dur)) : 0;
        this.setAiProgress(`🤖 تحليل الصوت: ${fmt(startMs)} ← ${fmt(endMs)} / ${fmt(dur)}`, startPct);
        await this.paintYield();

        const wav = new Float32Array(tail.length + pcmCore.length);
        wav.set(tail, 0);
        wav.set(pcmCore, tail.length);
        let sum = 0; for (let i = 0; i < wav.length; i++) sum += wav[i];
        const mean = sum / wav.length;
        let sq = 0; for (let i = 0; i < wav.length; i++) { const d = wav[i] - mean; sq += d * d; }
        const inv = 1 / Math.sqrt(sq / wav.length + 1e-7);
        for (let i = 0; i < wav.length; i++) wav[i] = (wav[i] - mean) * inv;

        const feeds = { input_values: new window.ort.Tensor('float32', wav, [1, wav.length]) };
        if (this.aiSess.inputNames.includes('attention_mask')) {
          feeds.attention_mask = new window.ort.Tensor('int64', new BigInt64Array(wav.length).fill(1n), [1, wav.length]);
        }
        const out = await this.aiSess.run(feeds);
        const tensor = out[this.aiSess.outputNames[0]];
        const dropLeft = tail.length === OV_SAMPLES ? OV_FRAMES : Math.floor(tail.length / 320);
        emChunks.push(this.quantizeLogSoftmax(tensor.data, tensor.dims[1], tensor.dims[2], dropLeft));

        tail = pcmCore.length >= OV_SAMPLES
          ? pcmCore.slice(pcmCore.length - OV_SAMPLES)
          : new Float32Array(0);
        processedSamples += pcmCore.length;
        const doneMs = Math.round((processedSamples * 1000) / 16000);
        const pct = dur ? Math.min(95, Math.round((doneMs * 95) / dur)) : 0;
        this.setAiProgress(`🤖 تحليل الصوت: ${fmt(doneMs)} / ${fmt(dur)}`, pct);
        await this.paintYield();
      };

      const feedPcm = async (pcm) => {
        bufParts.push(pcm);
        bufLen += pcm.length;
        while (bufLen >= CHUNK_SAMPLES) {
          const merged = new Float32Array(bufLen);
          let off = 0; for (const p of bufParts) { merged.set(p, off); off += p.length; }
          await flushChunk(merged.subarray(0, CHUNK_SAMPLES));
          const rem = merged.slice(CHUNK_SAMPLES);
          bufParts = rem.length ? [rem] : [];
          bufLen = rem.length;
        }
      };

      if (this.audioBlob.size > 35 * 1024 * 1024 && await this.isMp3Blob(this.audioBlob, this.state.label)) {
        await this.decodeChunkedMp3(this.audioBlob, async (pcm) => { await feedPcm(pcm); }, signal);
      } else {
        const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
        try {
          const decoded = await ctx.decodeAudioData(await this.audioBlob.arrayBuffer());
          const pcm = decoded.getChannelData(0);
          for (let off = 0; off < pcm.length; off += CHUNK_SAMPLES) {
            await flushChunk(pcm.subarray(off, Math.min(pcm.length, off + CHUNK_SAMPLES)));
          }
        } finally {
          ctx.close().catch(() => {});
        }
      }

      if (bufLen > 0) {
        const rem = new Float32Array(bufLen);
        let off = 0; for (const p of bufParts) { rem.set(p, off); off += p.length; }
        await flushChunk(rem);
      }
      if (signal.aborted) throw new Error('aborted');

      this.setAiProgress('🤖 جارٍ مطابقة الآيات مع الصوت…', 96);
      await this.paintYield();
      const V = emChunks[0]?.V || (Math.max(...Object.values(this.aiVocab)) + 3);
      const totalFrames = emChunks.reduce((a, c) => a + c.frames, 0);
      const em = new Uint8Array(totalFrames * V);
      let emOff = 0; for (const c of emChunks) { em.set(c.q, emOff); emOff += c.q.length; }

      const ayahTokens = this.state.texts.map((t, i) => {
        let txt = t.replace(/^\uFEFF/, '');
        if (i === 0 && this.state.surah !== 1 && this.state.surah !== 9 && txt.startsWith('بِسْمِ')) {
          txt = txt.split(' ').slice(4).join(' ');
        }
        return this.normalizeForVocab(txt, this.aiVocab);
      });
      const blankId = this.aiVocab['<pad>'] ?? 33;
      const rawStarts = await this.alignCtc(em, totalFrames, V, ayahTokens, blankId, 2500, signal);
      if (!rawStarts) throw new Error('تعذّرت المحاذاة');

      const totalMs = this.state.duration || Math.round((processedSamples * 1000) / 16000);
      const refined = this.refineOnset(rawStarts, totalMs);
      this.state.starts = [0, ...refined];
      this.changed();
      this.setAiProgress('تم التوقيت بالذكاء الاصطناعي ✓ راجِع العلامات إن لزم.', 100, 'done');
    } catch (err) {
      if (err.message === 'aborted') {
        const bar = this.$('aiBar'); if (bar) bar.hidden = true;
        this.say('أُوقف التوقيت بالذكاء الاصطناعي.');
      } else {
        this.setAiProgress('تعذّر التوقيت بالذكاء الاصطناعي: ' + err.message, 0, 'err');
      }
    } finally {
      this.cancelAi();
    }
  }
  // Each verse runs from its start to the next marked start; the last verse
  // to the end of the file. The opening (ayah 0) runs from 0 to verse 1.
  timeline() {
    const s = this.state.starts, n = this.count(), dur = this.state.duration || null;
    return Array.from({ length: n + 1 }, (_, a) => {
      const start = a === 0 ? 0 : s[a] ?? null;
      let next = null;
      for (let b = a + 1; b <= n; b++) if (s[b] != null) { next = s[b]; break; }
      return { ayah: a, start, end: next ?? (a === n ? dur : null) };
    });
  }
  currentAyah() {
    const now = this.nowMs(), s = this.state.starts;
    let cur = 0;
    for (let a = 1; a < s.length; a++) if (s[a] != null && s[a] <= now) cur = a;
    return cur;
  }

  /* ---- import / export ---- */
  json() {
    const full = this.$('full').checked, t = this.timeline();
    const rows = t.filter((r) => r.start != null && r.end != null && r.end >= r.start && !(r.ayah === 0 && r.end <= 0));
    return JSON.stringify(rows.map((r) => full
      ? { ayah: r.ayah, polygon: null, start_time: r.start, end_time: r.end, x: null, y: null, page: null }
      : { ayah: r.ayah, start_time: r.start, end_time: r.end }), null, 1);
  }
  download() {
    const name = `${String(this.state.surah).padStart(3, '0')}.json`;
    const url = URL.createObjectURL(new Blob([this.json()], { type: 'application/json' }));
    const a = el('a', { href: url, download: name });
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  importText(text) {
    try {
      const rows = JSON.parse(text);
      if (!Array.isArray(rows)) throw new Error('not an array');
      const entries = [];
      for (const r of rows) {
        const a = +r.ayah, st = +(r.start_time ?? r.start);
        if (a >= 1 && a <= this.count() && isFinite(st) && st >= 0) entries.push([a, Math.round(st)]);
      }
      entries.sort((x, y) => x[0] - y[0]);
      const s = [0];
      let prev = 0, dropped = 0;
      for (const [a, st] of entries) {
        if (st < prev) { dropped++; continue; }
        while (s.length <= a) s.push(null);
        s[a] = st; prev = st;
      }
      this.state.starts = s; this.changed();
      const count = s.filter((v, i) => i && v != null).length;
      this.say(dropped ? `استُورد ${count} آية (تُجاهِل ${dropped} غير مرتّب).` : `استُورد ${count} آية.`);
    } catch (err) { this.say('ملف غير صالح: ' + err.message, true); }
  }
  async fetchTiming() {
    const m = this.moshaf();
    const read = m && this.timedReads?.get(this.norm(m.server));
    if (!read) return this.say('لا يوجد توقيت منشور لهذه التلاوة في mp3quran.', true);
    try {
      const rows = await fetch(`${API}/ayat_timing?surah=${this.state.surah}&read=${read}`).then((r) => r.json());
      if (!rows.length) return this.say('لا يوجد توقيت لهذه السورة.', true);
      this.importText(JSON.stringify(rows));
    } catch (err) { this.say('تعذّر الجلب: ' + err.message, true); }
  }

  /* ---- view ---- */
  say(text, err) { const s = this.$('status'); s.textContent = text; s.classList.toggle('err', !!err); }
  tick() {
    if (this.stopAt != null && !this.audio.paused && this.nowMs() >= this.stopAt - 30) {
      this.stopAt = null;
      this.audio.pause();
    }
    const cur = this.currentAyah();
    this.$('clock').textContent = `${fmt(this.nowMs())} / ${fmt(this.state.duration)}`;
    this.syncSeekbar();
    this.wave.update({ now: this.nowMs(), current: cur });
    if (cur !== this.lastCur) { this.lastCur = cur; this.refresh(); }
  }
  refresh() {
    const t = this.timeline(), cur = this.currentAyah(), n = this.count();
    const done = t.filter((r) => r.ayah > 0 && r.start != null).length;
    this.$('progress').textContent = `مُعلَّم ${done} من ${n}`;
    this.meter?.update({ done, total: n });
    const tc = this.$('tableCount'); if (tc) tc.textContent = `${done}/${n}`;
    this.$('play').textContent = this.audio.paused ? '▶ تشغيل' : '❚❚ إيقاف';
    const next = this.nextUnmarked();
    const markLbl = this.$('markLabel');
    if (markLbl) markLbl.textContent = next ? `علِّم بداية الآية ${next}` : 'اكتمل التعليم ✓';
    else this.$('mark').textContent = next ? `علِّم بداية الآية ${next}` : 'اكتمل التعليم ✓';
    this.$('mark').disabled = !this.state.duration || !next;
    const ed = this.textEdition();
    this.dataset.riwayah = ed;
    const page = this.state.pages?.[Math.max(0, cur - 1)] || null;
    this.stage?.update({ cur, next, texts: this.state.texts, riwayah: ed, page });
    this.mushaf?.render({ surah: this.state.surah, texts: this.state.texts, pages: this.state.pages, starts: this.state.starts, current: cur, riwayah: ed });
    this.table.render({ count: n, timeline: t, current: cur });
    this.wave.update({ starts: this.state.starts, now: this.nowMs(), current: cur });
    if (document.activeElement !== this.$('json')) this.$('json').value = this.json();
    this.$('clock').textContent = `${fmt(this.nowMs())} / ${fmt(this.state.duration)}`;
    this.syncSeekbar();
  }
  syncSeekbar() {
    const bar = this.$('seekbar'), dur = this.state.duration;
    bar.disabled = !dur;
    if (+bar.max !== dur) bar.max = dur;
    if (!this.seeking) bar.value = Math.round(this.nowMs());
    this.$('seekNow').textContent = fmt(this.nowMs());
    this.$('seekEnd').textContent = fmt(dur);
  }
  key(e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.composedPath?.().some((n) => n?.tagName === 'SMART-SELECT' && n.hasAttribute?.('open'))) return;
    const target = e.composedPath?.()[0] || e.target;
    if (target?.closest?.('input, textarea, select, smart-select, file-drop')) return;
    const btn = target?.closest?.('button, a');
    if (btn && (e.code === 'Enter' || (e.code === 'Space' && btn.matches?.(':focus-visible')))) return;
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); this.mark(); }
    else if (e.code === 'KeyP') this.toggle();
    else if (e.code === 'KeyZ') this.undo();
    // The waveform runs left to right in time, so the arrows do too.
    else if (e.code === 'ArrowLeft') this.seek(this.nowMs() - 5000);
    else if (e.code === 'ArrowRight') this.seek(this.nowMs() + 5000);
  }
}
customElements.define('ayah-timer', AyahTimer);
</script>
